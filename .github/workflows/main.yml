name: Advanced Text-to-Video Generation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Text prompt for generation'
        required: true
        default: 'A cute teddy bear waving hello'
      num_frames:
        description: 'Number of video frames'
        required: true
        default: 16
        type: number

jobs:
  generate-video:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install diffusers transformers accelerate pillow numpy opencv-python
        pip install imageio imageio-ffmpeg scikit-image

    - name: Run advanced generation
      env:
        PROMPT: ${{ github.event.inputs.prompt }}
        NUM_FRAMES: ${{ github.event.inputs.num_frames }}
      run: |
        python << 'EOF'
        import torch
        import numpy as np
        from PIL import Image, ImageDraw, ImageFont
        import cv2
        import os
        from pathlib import Path

        prompt = os.getenv('PROMPT', 'A cute teddy bear waving hello')
        num_frames = int(os.getenv('NUM_FRAMES', '16'))

        print(f"🎬 Generating: {prompt}")
        print(f"📊 Frames: {num_frames}")

        # Create animated frames
        width, height = 320, 240
        frames = []

        for i in range(num_frames):
            # Create base image
            img = Image.new('RGB', (width, height), color='lightblue')
            draw = ImageDraw.Draw(img)
            
            # Calculate animation progress
            progress = i / (num_frames - 1) if num_frames > 1 else 0
            
            # Draw animated elements
            # Animated circle (bouncing)
            circle_x = int(width * 0.5 + np.sin(progress * 4 * np.pi) * 50)
            circle_y = int(height * 0.3 + np.cos(progress * 2 * np.pi) * 20)
            draw.ellipse([circle_x-30, circle_y-30, circle_x+30, circle_y+30], 
                        fill='yellow', outline='orange', width=3)
            
            # Animated text
            text_x = int(width * 0.5)
            text_y = int(height * 0.7)
            draw.text((text_x-80, text_y), f"Frame {i+1}", fill='black')
            
            # Convert to numpy array for video
            frame_array = np.array(img)
            frames.append(frame_array)
            
            # Save individual frame
            Path("frames").mkdir(exist_ok=True)
            img.save(f"frames/frame_{i:03d}.png")

        # Create video
        video_path = "animated_video.mp4"
        fourcc = cv2.VideoWriter_fourcc(*'mp4v')
        fps = 15
        
        out = cv2.VideoWriter(video_path, fourcc, fps, (width, height))
        for frame in frames:
            frame_bgr = cv2.cvtColor(frame, cv2.COLOR_RGB2BGR)
            out.write(frame_bgr)
        out.release()

        print(f"✅ Video created: {video_path}")
        print(f"📊 Resolution: {width}x{height}, FPS: {fps}")
        EOF

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: animation-results
        path: |
          animated_video.mp4
          frames/
        retention-days: 7
