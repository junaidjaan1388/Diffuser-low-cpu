# .github/workflows/with-requirements.yml
name: Video Generation with Requirements

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Text prompt'
        required: true
        default: 'A cute teddy bear waving hello'

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies from requirements.txt
      run: |
        pip install -r requirements.txt
        
    - name: Generate video
      env:
        PROMPT: ${{ github.event.inputs.prompt }}
      run: |
        python -c "
        import torch
        from diffusers import DiffusionPipeline
        from diffusers.utils import export_to_video
        import os
        
        prompt = os.getenv('PROMPT', 'A cute teddy bear waving hello')
        print(f'Generating: {prompt}')
        
        pipe = DiffusionPipeline.from_pretrained('damo-vilab/text-to-video-ms-1.7b')
        pipe = pipe.to('cpu')
        
        result = pipe(
            prompt,
            num_inference_steps=50,
            num_frames=50,
            height=400,
            width=400,
        )
        
        export_to_video(result.frames[0], 'video.mp4')
        print('Done! Video saved as video.mp4')
        "
        
    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: generated-video
        path: video.mp4
